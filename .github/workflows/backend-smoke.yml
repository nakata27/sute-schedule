name: Backend smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - "scripts/**"
      - "requirements.txt"
      - "tests/**"
  pull_request:
    paths:
      - "backend/**"
      - "scripts/**"
      - "requirements.txt"
      - "tests/**"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate key imports
        run: |
          python -c "import requests, bs4; print('requests/bs4 ok')"
          python -m py_compile backend/fetcher/schedule_fetcher.py backend/fetcher/group_structure_fetcher.py scripts/update_mia_structure.py
